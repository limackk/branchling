  - name: "The follow-ups filed in waves 9 and 10 close"
    tasks: [TL-664, TL-660, TL-668, TL-663, TL-666, TL-669, TL-671, TL-675, TL-670, TL-665, TL-667, TL-672, TL-674, TL-673, TL-677, TL-678, TL-679, TL-680, TL-684, TL-685, TL-686, TL-688, TL-689, TL-690, TL-691, TL-692, TL-693, TL-694, TL-695, TL-698, TL-700, TL-701, TL-703, TL-704, TL-705, TL-706, TL-707, TL-708, TL-709, TL-710, TL-711, TL-712, TL-714, TL-715, TL-716, TL-717, TL-687, TL-718, TL-719, TL-720, TL-713, TL-724]

  # The viewer touches build-viewer.mjs and serve-backlog.mjs only, so it can
  # run beside the follow-up waves above rather than after them. Both halves exist
  # on their own branches; they land before the surface is judged as a whole.
  - name: "The viewer becomes an operating surface"
    tasks: [TL-451, TL-450]

  # Accessibility and cross-mode QA judge the complete editing and dashboard
  # surface rather than either half. The phone-width title row (TL-473)
  # lands earlier, so TL-452 judges a row that already fits.
  - name: "The expanded viewer earns trust"
    tasks: [TL-452]

  # Acts only a person can perform: a dated name clearance, a recorded demo,
  # an uploaded social preview, and vouches over the public Windows run and
  # the published community policies, the vouch on the superseded-run
  # cancellation (TL-498, moved from wave 3, where it held every later wave
  # shut) and the decision on task-graph.mjs (TL-555). The name is already
  # public, so TL-179
  # is the most urgent of them — every day without it raises the price of a
  # rename it might still require.
  - name: "Human publication gates"
    tasks: [TL-179, TL-456, TL-457, TL-498, TL-555, TL-647, TL-472, TL-102, TL-473, TL-652, TL-653, TL-696, TL-676, TL-721, TL-702]

  # The release happened; what stays open is the evidence that the next one
  # repeats it rather than remembering it. The announcement follows, because
  # it points at the demo, the front door and that release together.
  - name: "The release is repeatable and announced"
    tasks: [TL-455, TL-468]

  # Three run loops in worktrees of one clone paused on four separate causes.
  # A decided question that strands its task comes first because it is a plain
  # bug; then the dispatch rule behind every real code conflict, conflict
  # groups; then the opt-in gate and state commit that end the bookkeeping
  # cascade, a run that waits for work held in other trees instead of exiting,
  # and last the seeding, multi-id plan and closing contract that a module
  # backlog needs at intake.
  - name: "Parallel worktree loops stop colliding"
    tasks: [TL-490, TL-492, TL-489, TL-491, TL-493]

  # Every other release-tracking task reads the stage a task has reached, so the computation and the deploy_targets key land first and alone.
  - name: "Deploy stages are computed from git"
    tasks: [TL-501]

  # Three readers of the same computation that touch different commands: deploy status, check --release and doctor. They run side by side.
  - name: "The report, the gate and the fetch check"
    tasks: [TL-502, TL-503, TL-508]

  # The viewer needs the report and the gap detectors; planned scope and recorded stages extend the report. The owner chose to land the viewer before the unmerged viewer branches.
  - name: "Views and declarations on top of the report"
    tasks: [TL-504, TL-505, TL-506]

  # Small and last: it teaches the gap detectors to skip targets whose code lives in another repository, so it follows the gate and the scope check that it changes.
  - name: "Unobservable targets"
    tasks: [TL-507]

