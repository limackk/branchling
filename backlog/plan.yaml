  - name: "Upgrade follow-ups, first of each area"
    tasks: [TL-597, TL-592, TL-600, TL-594, TL-599, TL-602, TL-590]

  # Each follows the task of the previous wave that edits the same function: the task-creation guide after the overview guide, the floor below its key after the empty floor, the line endings of a replaced block after the unclosed block, and the template refresh after the skill directory row.
  - name: "Upgrade follow-ups, second of each area"
    tasks: [TL-598, TL-593, TL-601, TL-595]

  # The largest guide change comes last, because it renders beside the paragraphs TL-597 and TL-598 rewrite and extends the same promotion test.
  - name: "Upgrade follow-ups, the rest of the promotion surface"
    tasks: [TL-596]
