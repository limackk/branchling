# The execution order is a deliberate product decision, not a generated view.
# Earlier execution and fleet plans remain in Git history. They are not a
# current promise after the evidence-gated product boundary was adopted.
#
# THE PREVIOUS PLAN (2026-10-15) closed waves 1-8, 11 and 13 in full, and
# eight of its tasks closed in waves after the one it marked active. Its
# release wave was overtaken by the release itself: 0.1.0 reached npm on
# 2026-10-22 and 0.1.1 on 2026-10-26, before the name clearance it waited
# for. Its fifteen waves stay in Git history.
#
# THIS PLAN schedules the fifteen tasks still open on 2026-10-26, six of which
# that plan never placed. The order keeps the same argument — a green that
# means something first, outward claims last — and adds one: a human gate is
# closed by a vouch, so the vouch has to be recorded under the right name
# before any gate is closed with one.
updated: 2026-11-12
rationale: "The package is already public, so what remains is making each later claim true before it is made. Branchling first makes its suite answer the same way twice, then records a person's vouch as that person's and reads a CRLF checkout like an LF one; the viewer runs alongside, on files neither of those touches. Only then the human gates, and last the release evidence and the announcement that point at all of it."
waves:
  # A SUITE THAT IS RED BY CHANCE CLOSES NOTHING. `done` runs the suite, so a
  # duplicate id under load (TL-481) and a killed child read as unparseable
  # JSON (TL-486) each refuse a close that deserved to pass — and train the
  # next session to rerun until green, which is the habit this tool exists
  # to break.
  - name: "The suite answers the same way twice"
    tasks: [TL-481, TL-486]

  # A VOUCH UNDER THE WRONG NAME IS PERMANENT. Every gate in the human wave
  # below closes with a `manual:` vouch, and TL-460 records one typed by a
  # person as `agent:claude` in an append-only log. TL-479 precedes the
  # Windows vouch (TL-456): supporting Windows while a CRLF checkout reads
  # differently would be a claim the tool does not keep.
  - name: "A vouch and a checkout say what is true"
    tasks: [TL-460, TL-479]

  # THE FOLLOW-UPS FROM THE SUPERVISED LOOPS, AND THE TWO FROM THE TL-450
  # REVIEW. Every pending task an agent can take without a person and
  # without an open blocker, worked by four parallel loops. It comes before
  # the viewer wave because that wave's only open task is already claimed
  # and the waves after it wait on people. Tasks that edit one module share
  # a `conflict_group` (proofs, serve, json-envelope, log-task, viewer), so
  # `next` never hands two of them out at once; the rest touch disjoint
  # files. TL-473 stays in the wave that judges responsiveness.
  - name: "The supervised-loop follow-ups close"
    tasks: [TL-565, TL-563, TL-564, TL-548, TL-550, TL-551, TL-556, TL-559, TL-561, TL-562, TL-547, TL-549, TL-552, TL-553, TL-554, TL-557, TL-558, TL-560]

  # THE OPEN BACKLOG OF 2026-11-07, scheduled for four parallel loops. Every
  # pending task an agent can take without a person, thirty-seven of them,
  # thirty-six of which no earlier plan placed. They come before the viewer
  # wave for the reason wave 3 did: that wave's open task is claimed, and
  # every wave after it waits on people. Each wave mixes several
  # `conflict_group`s (hooks, json-envelope, skills, instructions, import,
  # viewer, config, doctor, release, consumer-doc), so `next` keeps two edits
  # of one module apart while the other loops still have work.
  #
  # First what every later wave stands on: a suite that leaves the temporary
  # directory as it found it, the two guides that send a consumer and an
  # implementer the wrong way, and the attribution `done` records. TL-571 and
  # TL-613 state one defect twice; they share a group, so the second runs
  # against the first's fix and closes on its own stronger contract.
  - name: "The suite leaves no trace and the guides stop misdirecting"
    tasks: [TL-575, TL-571, TL-613, TL-607, TL-614, TL-591, TL-569, TL-570]

  # Defects inside single modules, one group each: hook blocks, the new
  # --json refusals, the config reader, doctor's printed repairs, skills
  # install, and the GitHub import's own help.
  - name: "Hook blocks, refusals and repairs say what is true"
    tasks: [TL-609, TL-610, TL-622, TL-568, TL-574, TL-604, TL-611, TL-615, TL-616, TL-603, TL-577, TL-580]

  # The two features (Jira import, then its proof reaching the ticket), the
  # release surface reading one record, the viewer's small debts, and the
  # envelope for hooks and skills, which waits for both modules' fixes above.
  # TL-473 moves here from the trust wave: it needs no other viewer work.
  - name: "Jira joins the imports and the release surface reads one record"
    tasks: [TL-581, TL-582, TL-573, TL-612, TL-621, TL-566, TL-605, TL-567, TL-606, TL-608, TL-579]

  # The rest of the overview guide's release-gate sentences, which all edit
  # instructions.mjs and so run one after another, beside the exit line every
  # --help gains — last, because it touches the help of every command.
  - name: "The overview and every --help say what ships"
    tasks: [TL-617, TL-618, TL-619, TL-620, TL-572]

  # WHAT ONE SUPERVISED-LOOP SESSION TRIPPED OVER (2026-11-07), filed from
  # what it observed and checked in the code: a `next` that claims when asked
  # to look, a plan that reads as having work while no run can take any, a
  # mutation run that leaks hung processes and is too large to run before a
  # commit, task records read in filesystem order, a duplicate `new` did not
  # notice, and a reserved reason described two ways. The two mutation tasks
  # share a group, as do the two that touch the dispatch predicate. TL-647
  # waits with the human gates: its first step is the owner's decision.
  - name: "The loop surfaces stop misleading the loops"
    tasks: [TL-645, TL-644, TL-646, TL-648, TL-643, TL-649, TL-650]

  # THE FOLLOW-UPS THE LOOPS FILED while closing waves 4 to 6, seventeen of
  # them, none needing a person. Highest priority first: a dangling link that
  # still crashes `skills install` (TL-634), then the two P2 defects, then the
  # rest. Modules shared by several are grouped (skills, import, hooks,
  # attribution, doctor, mutation, json-envelope); TL-637 shares a group with
  # TL-572 because both reword messages across every command.
  - name: "The follow-ups the loops filed close"
    tasks: [TL-634, TL-626, TL-640, TL-627, TL-628, TL-629, TL-630, TL-631, TL-632, TL-633, TL-635, TL-636, TL-637, TL-638, TL-639, TL-641, TL-642]

  # THE FOLLOW-UPS FILED while closing waves 7 and 8, eleven of them, none
  # needing a person. The five that run or change mutation-run.mjs (TL-661
  # among them) share the mutation group with TL-646; TL-652 keeps the
  # viewer group. TL-662 asserts the output TL-649 added to `new`.
  - name: "The follow-ups filed in waves 7 and 8 close"
    tasks: [TL-651, TL-655, TL-656, TL-659, TL-661, TL-654, TL-657, TL-658, TL-662]

  # THE LOOPS' OWN PRECONDITIONS, before the next supervised run. Three
  # OOM kills on 2026-11-08 and 2026-11-09 came from parallel suites and
  # mutation runs with no machine-wide bound (TL-681); a mutation run's
  # cost was discovered only after it started (TL-682); and `next --plan`
  # answered "nothing to take" while a wave waited on claims or a merge,
  # so loops sat idle (TL-683). Placed before the wave-9/10 follow-ups so
  # that run has them. Joined after the 2026-11-10 run by a stop request
  # that `next` honours (TL-697), so a loop can finish its task and stop
  # without the orchestration being killed mid-merge, and by `done`
  # parking an unvouched manual entry as awaiting_vouch (TL-699), so such
  # a task stops holding an agent wave shut.
  - name: "The loops run within the machine's memory and never idle blindly"
    tasks: [TL-681, TL-682, TL-683, TL-697, TL-699]

  # THE FOLLOW-UPS FILED while closing waves 9 and 10, fifteen of them,
  # joined on 2026-11-10 by twelve from a review of the loop sessions
  # (TL-677 to TL-680, TL-684 to TL-691) and after the next run by more
