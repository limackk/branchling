# The execution ORDER — DATA, not a view: a person or an agent arranges it, and
# the tool only checks that it does not contradict `blocked_by`
# (`branchling check --plan`). The plan is ADVISORY: the truth about state stays
# in the task file's `status:`.
#
# The plan this one replaces ("First the dispatcher stops lying, then the loop")
# is finished and lives in the git history of this file. It built the loop; this
# one is the first arc RUN BY that loop, and its every task is picked so an
# unattended session can close it.
updated: 2026-09-06
rationale: "The unattended loop is proven. The next arc makes agent execution provider-neutral: repair control-plane writes first, separate project roles from user profiles, freeze one safe adapter contract, implement independent execution paths, preflight them, ship conformance-tested references and onboarding, then let managed fleets consume the stable surface."
waves:
  - name: "The loop may be trusted unattended"
    tasks: [TL-191, TL-190, TL-184, TL-185, TL-192]
    #
    # TL-192 was written by the agent that fixed TL-191, about its own fix: the
    # guard asks whether the status is archived and nothing else, so a task
    # taken from this run by somebody else is still written over. It belongs to
    # this wave's thesis rather than to a later one, because a wave that closes
    # while the hole is open would say the loop can be trusted when it cannot.
    # Both were measured on 2026-09-03, in the first unattended run of this very
    # plan, and both are about the tool lying quietly. TL-184: an agent that
    # could not authenticate never ran, and the loop wrote that into the task
    # as `blocked` and exited 0. TL-185: ten hand edits were absorbed into the
    # snapshot and recorded nowhere. A fleet whose report and whose log cannot
    # be believed is not worth pointing at the waves below.
    #
    # TL-191 and TL-190 were added after the SECOND run, on the same day and
    # for the same reason. TL-191 stands first because it is the only one of
    # the four that destroyed a fact: the loop wrote `blocked` over a task that
    # was done, committed and merged. TL-190 is the misread refusal that made
    # that path reachable, and the two must be fixed together or the first fix
    # will look like it worked.

  - name: "The run can be watched while it happens"
    tasks: [TL-210, TL-188, TL-122, TL-189]
    # Asked for on 2026-09-03, while the first unattended run was working: the
    # viewer, served from the main checkout, showed a board that had not moved
    # for two hours, because the work was on a branch in a worktree and that is
    # exactly what law 1 promises. TL-188 lets the page be pointed at another
    # worktree, TL-122 pushes the change instead of waiting for F5, and TL-189
    # fills the silence BETWEEN a task's two writes from the heartbeat log —
    # without it the other two only deliver two frames of a two-hour film.
    #
    # TL-210 joined on 2026-09-03 and stands first because it is the cheap
    # nine tenths of TL-188: the scan already reports a task running in another
    # worktree and the Tasks view already renders it, but an Execution card
    # derives everything from the local status, so a wave being worked on right
    # now stands still. The elapsed bar it would need is already built.

  - name: "A question a person can answer in a minute"
    tasks: [TL-204, TL-205]
    # Asked for on 2026-09-03 after reading `Waiting on you` on this backlog:
    # eleven rows, every one the same box in the same weight, and the two real
    # questions in it are paragraphs of prose because the asker had nowhere to
    # put structure. TL-204 gives a question its options and names the one it
    # recommends — the most solid, and the one that composes with what is
    # already here — so an agent that asks has done the analysis rather than
    # moved it. TL-205 renders that, and is blocked by it so the panel is
    # designed once against the final shape.
    #
    # It stands ahead of the loop's own honesty because every wave below can
    # stall on a question, and today answering one costs more than it should.

  - name: "What the loop says of itself is true"
    tasks: [TL-212, TL-206, TL-200, TL-186, TL-193, TL-194, TL-199]
    # TL-212 stands first, added 2026-09-03 from a reading of the panel: ten
    # rows under a heading promising decisions, five of which need none. It is
    # this wave's thesis one level up — the tool stating something about itself
    # that is not true — and it is the only one whose fix hands five tasks back
    # to the fleet.
    # Three things the tool states and cannot back. TL-186: a `--plan` run that
    # stops cannot say whether the plan is finished or merely waiting. TL-193:
    # a task parked because its contract asks a PERSON is recorded as having
    # run out of attempts, which it did not. TL-194: eight flags `query`
    # accepts are absent from its own `--help`. All three were found by agents
    # while working on something else, and each is a sentence a reader would
    # act on.
    #
    # TL-200 and TL-199 were added after the runs of 2026-09-03 and are the same
    # failure one level apart. TL-200: five consecutive successful runs reported
    # `0 closed`, because this project tells an agent to close its own task and
    # the loop calls that `closed-elsewhere` — true, and read by a cron as
    # nothing happened. TL-199: a wave stalled on an `executor: human` task
    # looks exactly like a wave stalled on work. TL-200 stands first: a false
    # negative in the one field an unattended caller reads is worse than a
    # missing explanation in a report a person is already reading.

    #
    # TL-206 joined on the same day and stands first in this wave: `run --plan
    # --dry-run` listed twenty-two tasks and `run --plan` took none, one second
    # apart in the same tree, because wave 2 held one open task marked for a
    # person. Two code paths answering one question differently is worse than
    # either answer, and the answer itself — may the fleet run ahead of a wave
    # only a person can finish — is a question to ASK, not to settle quietly.

  - name: "The dispatcher can follow a plan"
    tasks: [TL-183]
    # Written on 2026-09-03 while preparing this very plan: `next` and `run`
    # never open `plan.yaml`, so the first thing `run --dry-run` offered was a
    # task from wave 6, because it carries the highest priority. Until `--plan`
    # exists, every wave below is an order a person has to enforce by hand — so
    # it stands first, and it is the one task in this arc that the arc is about.

  - name: "The record says who did what"
    tasks: [TL-214, TL-180, TL-187, TL-195]
    # Everything downstream reads the history as evidence — the audit, the PR
    # comment, an actor's record. TL-181 (the rollup was never committed) and
    # TL-182 (`new` wrote no history) were closed on 2026-09-03 and are the
    # other two thirds of this wave; TL-180 is the last one left: a fresh
    # worktree signs the whole tree as created by whoever reconciled it first.
    #
    # TL-187 and TL-195 joined after the runs of 2026-09-03. TL-187: TL-182 is
    # closed and `new` still writes no history, and its contract could not tell.
    # TL-195: the post-edit hook reconciles the tree the working directory
    # points at, not the one the edited file lives in. All three are the same
    # question asked in three places — whose change is this — and TL-185 has
    # already shown what it costs when the answer is nobody's.

  - name: "The guards over the public surface hold"
    tasks: [TL-203, TL-202, TL-201, TL-198, TL-196]
    # Four findings about the checks that decide what a stranger may read.
    # TL-202 first, because it is the only one that has already stopped the
    # tool: a session moved `foreign_context_words` to the user layer — the
    # right call, TL-196's — and every other tree on the machine, still running
    # code that calls it a project key, exited 2 until it merged. A write
    # outside the worktree is instant everywhere; a write inside it waits for a
    # merge, which is the whole of law 1.
    # TL-201 replaces the language heuristic with a dictionary, which is why
    # TL-198 (the word it passes over) is blocked by it rather than patched.
    # TL-196 extends the foreign-context guard past `docs/`.
    #
    # TL-203 stands first and is the only task in this plan marked
    # `executor: human`. TL-196 took the origin project's name out of the tree
    # and the reconciler, doing its job, copied the old values into an
    # append-only log — so the name is out of the working tree and still in the
    # objects. Taking it out of the objects is a history rewrite: every other
    # session must stop, the refs must be bundled first, and every worktree
    # reset afterwards. No unattended run can do that, and one started while
    # another session is committing destroys that session's work.

  - name: "Refusals the writing commands still lack"
    tasks: [TL-211, TL-213, TL-167, TL-173, TL-58]
    # Three inputs a command accepts today and should not: a reason long enough
    # to be empty or reserved, a comment between verification entries, a value
    # starting with a dash. They are grouped because they are the same defect
    # class — validation at the write boundary — and because an unattended run
    # needs short tasks with a bash contract before it is trusted with long ones.

  - name: "Premises that went stale"
    tasks: [TL-143, TL-144, TL-128]
    # Tasks whose text argues from a state of the repository that no longer
    # holds. They cost half an hour each and they poison the queue: an agent
    # handed a task built on a false premise does the wrong work confidently.

  - name: "What a session leaves behind"
    tasks: [TL-80]
    # Separating comments, implementation notes and the final summary. It comes
    # before the resume because the briefing has to have something to quote.

  - name: "A dead session is resumed, not restarted"
    tasks: [TL-151]
    # `resume <ID>` composes the file, the history since the take, the branch
    # diff and a fresh `done --dry-run`. The loop already hands a claim back
    # after `abandoned_after_days`; without this the successor starts from zero.

  - name: "Measurement of the run"
    tasks: [TL-150, TL-91]
    # Both read the trace the waves above leave: an actor's record computed from
    # the log, and the board replayed through time. They are last because they
    # measure, and there is nothing to measure before the work is done.

  # Before provider-neutral execution expands, the plan is explicit and concurrent task creation or attribution cannot silently corrupt its durable record.
  - name: "Control-plane writes are safe before execution scales"
    tasks: [TL-299, TL-295, TL-302]

  # Project-owned role briefs and user-owned provider profiles define the two configuration layers independently before they meet.
  - name: "Roles and profiles have distinct owners"
    tasks: [TL-264, TL-288]

  # A stable executable contract is the seam every CLI, API harness and local model implements without provider branches in core.
  - name: "One contract serves every provider"
    tasks: [TL-289]

  # Trust, secret handling and shell boundaries are fixed before multiple run modes and third-party adapters depend on them.
  - name: "The execution boundary is safe before it is convenient"
    tasks: [TL-300]

  # API harnesses, role routing, a single generalist and the conformance kit can proceed independently once the shared contract and trust boundary exist.
  - name: "Every execution path implements the same contract"
    tasks: [TL-290, TL-291, TL-292, TL-296]

  # Preflight is meaningful only after both generalist and role-based profile selection exist, and it must fail before either path claims work.
  - name: "Profiles fail before tasks do"
    tasks: [TL-294]

  # Copyable CLI and API adapters are published only after conformance, preflight and the execution modes can test them as ordinary third-party executables.
  - name: "Reference adapters prove the extension path"
    tasks: [TL-301]

  # Onboarding is the integration gate: it documents only profiles, adapters, checks and routes already proven by earlier waves.
  - name: "A mixed-provider setup works in five minutes"
    tasks: [TL-293]

  # Parallel worktree lifecycle follows the provider-neutral single-agent loop and its onboarding instead of defining those contracts inside fleet machinery.
  - name: "Managed fleets consume the stable execution surface"
    tasks: [TL-149]
