# The execution ORDER — DATA, not a view: a person or an agent arranges it, and
# the tool only checks that it does not contradict `blocked_by`
# (`worktrail check --plan`). The plan is ADVISORY: the truth about state stays
# in the task file's `status:`.
updated: 2026-09-01
rationale: "First the dispatcher stops lying, then the loop, then roles and the human in the loop; the view reads finished state, so it goes last."
waves:
  - name: "Foundation"
    tasks: [TL-107]

  - name: "Consumers of the plan"
    tasks: [TL-108]
    # The `together` group [TL-108, TL-109] was DISSOLVED, not lost: it existed
    # to force one data shape by writing both at once, and TL-108 has already
    # shipped. The shared shape now lives in `plan.mjs` and TL-109 has to fit
    # it, so keeping it here would tie it to a closed task — and a group over a
    # closed task proves nothing.

  - name: "The dispatcher tells the truth"
    tasks: [TL-133, TL-125]
    # Both are a PRECONDITION of the loop, not part of it. TL-133: `next`
    # selects from the local tree and does not read the branch scan, so a fleet
    # is handed tasks that were finished elsewhere — a loop built on that would
    # be measuring its own defect. TL-125: TL-96 and TL-101 both call
    # `worktrail close` and no command by that name exists. Settling the name
    # AFTER both consumers are written means rewriting both.

  - name: "The execution loop"
    tasks: [TL-96, TL-101]
    # One surface, two consumers: the `next → agent → close` loop and the skill
    # that should stop editing files by hand. A divergence between them shows
    # only when both are written against a single shape of the command.
    together: [[TL-96, TL-101]]

  - name: "Roles in the dispatcher"
    tasks: [TL-98]
    # `next --role` and one agent per role only make sense above a working
    # loop: a role is a selection filter, and there is nothing to filter until
    # there is a queue.

  - name: "The human in the loop"
    tasks: [TL-113, TL-114]
    # TL-113 enforces `executor:` in the dispatcher — it needs the roles from
    # TL-98. TL-114 (`__decision__` and `worktrail decide`) is independent, but
    # it stands here because the panel in the next wave needs BOTH: what a
    # demand for a human is, and what their answer is.

  - name: "The decision view"
    tasks: [TL-115, TL-116]
    # They read events that the earlier waves do not write yet.

  - name: "Evidence of work"
    tasks: [TL-89, TL-90, TL-91]
    # All three read the TRACE the loop leaves behind: a PR comment carrying
    # the evidence, an audit of declarations against activity, a time-lapse from
    # the event log. Before the loop exists they have nothing to stand on.

  - name: "The view on top"
    tasks: [TL-109]
    # Presentation of finished state — hence last, behind the work that
    # produces that state.

  - name: "The critical path"
    tasks: [TL-110]
    # Its own wave, because TL-110 reads the view from TL-109: inside one wave
    # the guard cannot tell "in sequence" from "in parallel", and here parallel
    # is not possible.
