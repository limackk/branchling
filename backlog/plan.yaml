# The execution order is a deliberate product decision, not a generated view.
# Earlier execution and fleet plans remain in Git history. They are not a
# current promise after the evidence-gated product boundary was adopted.
updated: 2026-09-08
rationale: "Branchling first removes product surfaces that turn a repository-owned evidence protocol into a tracker, portfolio or fleet manager. Only then does onboarding demonstrate the reduced delivery loop."
waves:
  # This gate cancels the superseded roadmap and makes the boundary executable
  # before implementation removes capabilities that users may still rely on.
  - name: "Evidence-gated product boundary"
    tasks: [TL-377]

  # These removals are independent once the boundary is recorded. They leave
  # one repository, a durable ledger, task verification and a small queue.
  - name: "Remove non-core product surfaces"
    tasks: [TL-378, TL-380, TL-381, TL-383]

  # The viewer depends on telemetry removal; the thin adapter depends on the
  # execution boundary. They complete the interactions that remain in core.
  - name: "Finish the reduced interaction surface"
    tasks: [TL-379, TL-382]

  # Onboarding is the integration proof, so it follows every retained surface.
  - name: "Validate the evidence-gated product"
    tasks: [TL-384]
