# The backlog diff, as a pull-request comment.
#
# Copy this file to `.github/workflows/pr-summary.yml` in your repository.
#
# WHAT IT DOES. On every push to a pull request it runs `branchling pr-summary`
# and posts the result as ONE comment, updated in place. A reviewer then sees
# which tasks the branch touched and which statuses moved, beside the code diff
# they were already going to read.
#
# WHY THE JOB IS THIS SHORT. Every decision is in the command; this file is
# checkout, run, comment. That is the point rather than an economy: the same
# `branchling pr-summary` works unchanged in GitLab CI, in a git hook, or typed
# into a terminal, because the interface is its output and not a plugin API.
# If you need something different in the comment, change the command's flags
# here — do not add logic to this file.
#
# THE ONE THING THAT MUST NOT BE CHANGED CARELESSLY is `fetch-depth: 0`. The
# summary is a range, `<base>...HEAD`, so a shallow checkout gives the runner no
# base commit to compare against and the command says so instead of guessing.
#
# COST INFORMATION IS OFF. Add `--cost` only if you are content for token
# counts, model names and amounts to be visible to everyone who can read the
# pull request — on a public repository, that is everyone.

name: backlog summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The token needs to write a comment and nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the summary is a range, and a shallow clone has
          # no base to compare against.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Summarise the backlog
        id: summary
        run: |
          npx --yes branchling pr-summary \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            > summary.md
          cat summary.md

      # One comment, updated in place. A new comment on every push turns a
      # busy pull request into a wall of near-identical summaries.
      - name: Post it
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync("summary.md", "utf8");
            const marker = "<!-- branchling-pr-summary -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            );
            const mine = existing.find((c) => c.body && c.body.includes(marker));

            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id, body: marker + "\n" + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: marker + "\n" + body,
              });
            }
